<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Reels — ElevenLabs + VideoFX</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;700;800;900&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#000;
    display:flex; align-items:center; justify-content:center;
    width:100vw; height:100vh; overflow:hidden;
  }
  canvas { transform-origin:center center; display:block; }
  #ui {
    position:fixed; bottom:18px; left:50%;
    transform:translateX(-50%);
    display:flex; gap:10px; z-index:100;
  }
  button {
    padding:9px 22px; border:none; border-radius:8px;
    background:rgba(255,255,255,.13); color:#fff;
    font-size:13px; cursor:pointer;
    border:1px solid rgba(255,255,255,.18);
  }
  button:disabled { opacity:.35; cursor:default; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <button id="btnPlay">&#9654; 재생</button>
  <button id="btnRec">&#9210; 녹화</button>
</div>
<script>
// ── Constants ────────────────────────────────────────────────────────────────
const W=1080, H=1920, TOTAL=25000, FPS=30, BITRATE=10_000_000;
const FKR='"Noto Sans KR",sans-serif', FEN='"Inter",sans-serif';

const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
cv.width=W; cv.height=H;

function resize(){
  const s=Math.min(innerWidth/W,innerHeight/H)*.95;
  cv.style.transform=`scale(${s})`;
}
resize(); addEventListener('resize',resize);

// ── Helpers ──────────────────────────────────────────────────────────────────
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>Math.min(Math.max(v,a),b);
const eO=t=>1-Math.pow(1-t,3);   // ease-out cubic
const eIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;

// ── Scenes ───────────────────────────────────────────────────────────────────
const SCENES=[
  {id:'hook',   s:0,     e:3000 },
  {id:'vfx',    s:3000,  e:9000 },
  {id:'eleven', s:9000,  e:16000},
  {id:'benefit',s:16000, e:20000},
  {id:'cta',    s:20000, e:25000},
];
function getScene(t){
  for(const s of SCENES)if(t>=s.s&&t<s.e)return s;
  return SCENES[SCENES.length-1];
}

// ── Particle system (VideoFX 배경 시뮬레이션) ─────────────────────────────────
const NPTS=160;
const pts=Array.from({length:NPTS},()=>({
  x:Math.random()*W, y:Math.random()*H,
  vx:(Math.random()-.5)*.28, vy:-(Math.random()*.22+.05),
  r:Math.random()*1.6+.3,
  op:Math.random()*.38+.06,
  hue:Math.random()>0.6?260:230, // blue or purple
}));

function tickPts(){
  pts.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy;
    if(p.y<-8){p.y=H+8;p.x=Math.random()*W;}
    if(p.x<-8)p.x=W+8; if(p.x>W+8)p.x=-8;
  });
}

function drawPts(brightness=1){
  // neural connections
  for(let i=0;i<NPTS;i++) for(let j=i+1;j<NPTS;j++){
    const dx=pts[i].x-pts[j].x, dy=pts[i].y-pts[j].y;
    const d=Math.sqrt(dx*dx+dy*dy);
    if(d<130){
      ctx.save();
      ctx.globalAlpha=(1-d/130)*.1*brightness;
      ctx.strokeStyle=`hsl(${pts[i].hue},80%,65%)`;
      ctx.lineWidth=.7;
      ctx.beginPath();ctx.moveTo(pts[i].x,pts[i].y);ctx.lineTo(pts[j].x,pts[j].y);ctx.stroke();
      ctx.restore();
    }
  }
  // nodes
  pts.forEach(p=>{
    ctx.save();
    ctx.globalAlpha=p.op*brightness;
    ctx.shadowColor=`hsl(${p.hue},80%,65%)`;
    ctx.shadowBlur=6;
    ctx.fillStyle=`hsl(${p.hue},70%,75%)`;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
    ctx.restore();
  });
}

// ── Background ────────────────────────────────────────────────────────────────
function drawBg(t,sceneId){
  // 심도있는 다크 배경
  ctx.fillStyle='#07070F';
  ctx.fillRect(0,0,W,H);

  // 씬별 컬러 무드
  const hue=sceneId==='eleven'?280:sceneId==='benefit'?200:240;
  const a1=ctx.createRadialGradient(W*.5,H*.3,0,W*.5,H*.3,H*.65);
  a1.addColorStop(0,`hsla(${hue},60%,15%,.7)`);
  a1.addColorStop(1,'transparent');
  ctx.fillStyle=a1; ctx.fillRect(0,0,W,H);

  const a2=ctx.createRadialGradient(W*.15,H*.85,0,W*.15,H*.85,H*.5);
  a2.addColorStop(0,`hsla(${hue+30},50%,12%,.4)`);
  a2.addColorStop(1,'transparent');
  ctx.fillStyle=a2; ctx.fillRect(0,0,W,H);

  // 파티클 (VideoFX 배경 느낌)
  drawPts(1);

  // 상단/하단 비네트
  const vT=ctx.createLinearGradient(0,0,0,500);
  vT.addColorStop(0,'rgba(4,3,14,.88)');vT.addColorStop(1,'transparent');
  ctx.fillStyle=vT; ctx.fillRect(0,0,W,500);

  const vB=ctx.createLinearGradient(0,H-700,0,H);
  vB.addColorStop(0,'transparent');vB.addColorStop(1,'rgba(4,3,14,.96)');
  ctx.fillStyle=vB; ctx.fillRect(0,H-700,W,700);
}

// ── Text utilities ────────────────────────────────────────────────────────────
function gText(text,cx,cy,font,c0,c1){
  ctx.font=font; ctx.textAlign='center'; ctx.textBaseline='middle';
  const tw=ctx.measureText(text).width;
  const g=ctx.createLinearGradient(cx-tw/2,0,cx+tw/2,0);
  g.addColorStop(0,c0); g.addColorStop(1,c1);
  ctx.fillStyle=g; ctx.fillText(text,cx,cy);
}

function glitch(text,cx,cy,font,gi){
  ctx.font=font; ctx.textAlign='center'; ctx.textBaseline='middle';
  if(gi>0){
    const off=gi*16;
    ctx.save(); ctx.globalAlpha=.5;
    ctx.fillStyle='rgba(255,30,100,1)'; ctx.fillText(text,cx-off,cy+3);
    ctx.fillStyle='rgba(0,210,255,1)';  ctx.fillText(text,cx+off,cy-3);
    ctx.restore();
  }
  ctx.fillStyle='#fff'; ctx.fillText(text,cx,cy);
}

function neon(text,cx,cy,font,color,blur){
  ctx.save();
  ctx.font=font; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.shadowColor=color; ctx.shadowBlur=blur;
  ctx.fillStyle=color; ctx.fillText(text,cx,cy);
  ctx.shadowBlur=blur*.4; ctx.fillStyle='#fff'; ctx.fillText(text,cx,cy);
  ctx.restore();
}

// ── Badge ─────────────────────────────────────────────────────────────────────
function badge(){
  const txt='@ai.saver_', px=76,py=74,h=56,pad=28;
  ctx.save();
  ctx.font=`600 27px ${FEN}`;
  const tw=ctx.measureText(txt).width;
  ctx.beginPath(); ctx.roundRect(px,py,tw+pad*2,h,h/2);
  ctx.fillStyle='rgba(255,255,255,.07)'; ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.18)'; ctx.lineWidth=1.5; ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.85)';
  ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillText(txt,px+pad,py+h/2);
  ctx.restore();
}

// ── Scan-line reveal ──────────────────────────────────────────────────────────
function scanReveal(p){
  const y=H*p;
  ctx.save();
  const g=ctx.createLinearGradient(0,y-90,0,y+8);
  g.addColorStop(0,'transparent');
  g.addColorStop(.65,'rgba(75,111,255,.14)');
  g.addColorStop(1,'rgba(160,190,255,.5)');
  ctx.fillStyle=g; ctx.fillRect(0,y-90,W,98);
  ctx.restore();
}

// ── Explosion ─────────────────────────────────────────────────────────────────
let boom=[], boomDone=false;
function triggerBoom(cx,cy){
  boom=Array.from({length:90},()=>({
    x:cx,y:cy,
    vx:(Math.random()-.5)*24,
    vy:(Math.random()-.5)*24,
    r:Math.random()*4+1,
    life:1,
    col:Math.random()>.5?'#4B6FFF':'#A78BFA',
  }));
}
function drawBoom(){
  boom=boom.filter(p=>p.life>0);
  boom.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy; p.vy+=.4; p.life-=.024;
    ctx.save();
    ctx.globalAlpha=p.life;
    ctx.shadowColor=p.col; ctx.shadowBlur=10;
    ctx.fillStyle=p.col;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
    ctx.restore();
  });
}

// ── ★ SCENES ★ ────────────────────────────────────────────────────────────────

// ① HOOK — 반전 후킹 (글리치)
function drawHook(e){
  const cx=W/2, cy=H*.47;
  const l1=clamp(e/650,0,1);
  const l2=clamp((e-700)/600,0,1);
  const l3=clamp((e-1350)/650,0,1);
  const gi2=l2>0&&l2<.35?(1-l2/.35)*.9:0;
  const gi3=l3>0&&l3<.35?(1-l3/.35)*.9:0;

  if(l1>0){
    ctx.save(); ctx.globalAlpha=eO(l1);
    ctx.font=`400 48px ${FKR}`; ctx.fillStyle='rgba(160,180,255,.68)';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('사실 이 영상,',cx,cy-218);
    ctx.restore();
  }
  if(l2>0){
    ctx.save(); ctx.globalAlpha=eO(l2);
    ctx.shadowColor='#4B6FFF'; ctx.shadowBlur=55;
    glitch('찍은 게',cx,cy-48,`900 172px ${FKR}`,gi2);
    ctx.restore();
  }
  if(l3>0){
    ctx.save(); ctx.globalAlpha=eO(l3);
    ctx.shadowColor='#8B5CF6'; ctx.shadowBlur=75;
    glitch('아닙니다.',cx,cy+132,`900 158px ${FKR}`,gi3);
    ctx.restore();
  }
  const sub=clamp((e-2150)/550,0,1);
  if(sub>0){
    ctx.save(); ctx.globalAlpha=eO(sub)*.62;
    ctx.font=`400 45px ${FKR}`; ctx.fillStyle='#fff';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('목소리도요.',cx,cy+278);
    ctx.restore();
  }
}

// ② VIDEOFX — 풀스크린 텍스트 오버레이 (카드 없음)
function drawVFX(e){
  const cx=W/2, cy=H*.47;
  const step=clamp(e/500,0,1);
  const t1=clamp((e-500)/700,0,1);
  const t2=clamp((e-1400)/700,0,1);
  const t3=clamp((e-2300)/700,0,1);
  const t4=clamp((e-3400)/700,0,1);

  // 데이터 스트림 강화
  if(step>0){
    const alpha=eO(step)*.5;
    ctx.save();
    ctx.font=`700 22px ${FEN}`; ctx.textAlign='center';
    for(let i=0;i<18;i++){
      const x=(i/18)*W+24;
      for(let j=0;j<14;j++){
        const y=(j*52+e*((i%3===0?1.2:0.8))*0.065)%H;
        ctx.globalAlpha=(1-j/14)*alpha;
        ctx.fillStyle=`rgba(75,111,255,1)`;
        ctx.fillText(Math.random()>.5?'1':'0',x,y);
      }
    }
    ctx.restore();
  }

  if(step>0){
    ctx.save(); ctx.globalAlpha=eO(step);
    ctx.font=`700 34px ${FEN}`; ctx.fillStyle='rgba(150,170,255,.6)';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.letterSpacing='0.2em';
    ctx.fillText('STEP 01  ·  VideoFX',cx,cy-310);
    ctx.restore();
  }
  if(t1>0){
    ctx.save(); ctx.globalAlpha=eO(t1);
    ctx.shadowColor='#4B6FFF'; ctx.shadowBlur=40;
    gText('배경 영상',cx,cy-160,`900 138px ${FKR}`,'#6B8FFF','#A78BFA');
    ctx.restore();
  }
  if(t2>0){
    ctx.save(); ctx.globalAlpha=eO(t2);
    ctx.shadowColor='#4B6FFF'; ctx.shadowBlur=30;
    gText('AI가 만든다',cx,cy+10,`900 138px ${FKR}`,'#A78BFA','#6B8FFF');
    ctx.restore();
  }
  if(t3>0){
    ctx.save(); ctx.globalAlpha=eO(t3)*.72;
    ctx.font=`400 46px ${FKR}`; ctx.fillStyle='rgba(255,255,255,.8)';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('텍스트 한 줄 → 10초 영상',cx,cy+172);
    ctx.restore();
  }
  if(t4>0){
    ctx.save(); ctx.globalAlpha=eO(t4)*.55;
    ctx.font=`400 38px ${FKR}`; ctx.fillStyle='rgba(150,170,255,.8)';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('촬영 장비 0원 · 편집 실력 0점',cx,cy+268);
    ctx.restore();
  }
}

// ③ ELEVENLABS — 소나 파형 + 풀스크린 텍스트
function drawEleven(e){
  const cx=W/2, cy=H*.47;
  // 소나 파형 (배경)
  for(let i=0;i<7;i++){
    const ph=((e*.00075+i*.18)%1);
    const r=ph*520;
    const al=(1-ph)*0.38;
    ctx.save();
    ctx.globalAlpha=al;
    ctx.strokeStyle=i%2===0?'#4B6FFF':'#8B5CF6';
    ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.arc(cx,cy-30,r,0,Math.PI*2); ctx.stroke();
    ctx.restore();
  }

  const step=clamp(e/500,0,1);
  const t1=clamp((e-500)/700,0,1);
  const t2=clamp((e-1400)/700,0,1);
  const t3=clamp((e-2400)/700,0,1);
  const t4=clamp((e-3600)/700,0,1);

  if(step>0){
    ctx.save(); ctx.globalAlpha=eO(step);
    ctx.font=`700 34px ${FEN}`; ctx.fillStyle='rgba(167,139,250,.6)';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('STEP 02  ·  ElevenLabs',cx,cy-310);
    ctx.restore();
  }
  if(t1>0){
    ctx.save(); ctx.globalAlpha=eO(t1);
    ctx.shadowColor='#8B5CF6'; ctx.shadowBlur=44;
    gText('내 목소리를',cx,cy-150,`900 138px ${FKR}`,'#A78BFA','#6B8FFF');
    ctx.restore();
  }
  if(t2>0){
    ctx.save(); ctx.globalAlpha=eO(t2);
    ctx.shadowColor='#8B5CF6'; ctx.shadowBlur=44;
    gText('AI가 복제한다',cx,cy+18,`900 130px ${FKR}`,'#6B8FFF','#A78BFA');
    ctx.restore();
  }
  if(t3>0){
    ctx.save(); ctx.globalAlpha=eO(t3)*.72;
    ctx.font=`400 46px ${FKR}`; ctx.fillStyle='rgba(255,255,255,.8)';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('30초 녹음 → 목소리 클론 완성',cx,cy+178);
    ctx.restore();
  }
  if(t4>0){
    ctx.save(); ctx.globalAlpha=eO(t4)*.55;
    ctx.font=`400 38px ${FKR}`; ctx.fillStyle='rgba(167,139,250,.8)';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('나레이션 · 유튜브 · 릴스 전부 가능',cx,cy+268);
    ctx.restore();
  }
}

// ④ BENEFIT — 스캔 리빌 + 3가지 NO
function drawBenefit(e){
  const cx=W/2, cy=H*.45;
  const sp=clamp(e/1800,0,1);
  if(sp<1) scanReveal(eIO(sp));

  const items=[
    {text:'촬영 NO', t:clamp(e/600,0,1)},
    {text:'녹음 NO',  t:clamp((e-700)/600,0,1)},
    {text:'편집 NO',  t:clamp((e-1400)/600,0,1)},
  ];
  const yPos=[cy-200, cy-30, cy+140];

  items.forEach(({text,t},i)=>{
    if(t>0){
      const slide=lerp(60,0,eO(t));
      ctx.save();
      ctx.globalAlpha=eO(t);
      ctx.translate(0,slide);
      ctx.shadowColor='#4B6FFF'; ctx.shadowBlur=50;
      gText(text,cx,yPos[i],`900 156px ${FKR}`,'#6B8FFF','#A78BFA');
      ctx.restore();
    }
  });

  const sub=clamp((e-2500)/500,0,1);
  if(sub>0){
    ctx.save(); ctx.globalAlpha=eO(sub)*.7;
    ctx.font=`400 42px ${FKR}`; ctx.fillStyle='rgba(255,255,255,.8)';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('세팅 10분이면 충분',cx,cy+300);
    ctx.restore();
  }
}

// ⑤ CTA — 카운터 + 네온 펄스
let cntDone=false;
function drawCTA(e){
  const cx=W/2, cy=H*.45;
  const num=Math.min(Math.round(lerp(0,10,eO(clamp(e/900,0,1)))),10);

  if(num===10&&!cntDone){triggerBoom(cx,cy-100); cntDone=true;}
  drawBoom();

  const l1=clamp(e/450,0,1);
  const l2=clamp((e-500)/600,0,1);
  const l3=clamp((e-1200)/600,0,1);
  const l4=clamp((e-2100)/600,0,1);
  const pulse=.55+.45*Math.sin(e*.0045);

  if(l1>0){
    ctx.save(); ctx.globalAlpha=eO(l1);
    ctx.font=`400 48px ${FKR}`; ctx.fillStyle='rgba(160,180,255,.65)';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('세팅에 걸린 시간',cx,cy-270);
    ctx.restore();
  }
  if(l1>0){
    ctx.save(); ctx.globalAlpha=eO(l1);
    const pop=l1<.6?lerp(.6,1.1,eO(l1/.6)):lerp(1.1,1,eO((l1-.6)/.4));
    ctx.translate(cx,cy-80); ctx.scale(pop,pop);
    ctx.shadowColor='#4B6FFF'; ctx.shadowBlur=110;
    gText(String(num),0,0,`900 310px ${FEN}`,'#6B8FFF','#A78BFA');
    ctx.restore();
  }
  if(l2>0){
    ctx.save(); ctx.globalAlpha=eO(l2);
    ctx.font=`900 86px ${FKR}`; ctx.fillStyle='#fff';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('분이면 끝',cx,cy+130);
    ctx.restore();
  }
  if(l3>0){
    const glow=38+pulse*32;
    ctx.save(); ctx.globalAlpha=eO(l3);
    neon('댓글에 "목소리"',cx,cy+268,`900 80px ${FKR}`,'rgba(75,111,255,1)',glow);
    ctx.restore();
  }
  if(l4>0){
    ctx.save(); ctx.globalAlpha=eO(l4)*.7;
    ctx.font=`400 40px ${FKR}`; ctx.fillStyle='rgba(255,255,255,.85)';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('세팅법 DM 드릴게요',cx,cy+385);
    ctx.restore();
  }
}

// ── Render loop ───────────────────────────────────────────────────────────────
let st=null, aid=null, playing=false;

function render(now){
  if(!st)st=now;
  const el=now-st, t=Math.min(el,TOTAL);
  tickPts();
  const sc=getScene(t), se=t-sc.s;
  drawBg(t,sc.id);
  badge();
  if(sc.id==='hook')    drawHook(se);
  if(sc.id==='vfx')     drawVFX(se);
  if(sc.id==='eleven')  drawEleven(se);
  if(sc.id==='benefit') drawBenefit(se);
  if(sc.id==='cta')     drawCTA(se);
  if(t<TOTAL){
    aid=requestAnimationFrame(render);
  } else {
    if(window._rc){window._rc();window._rc=null;}
    playing=false;
    document.getElementById('btnPlay').textContent='\u25B6 재생';
    document.getElementById('btnRec').disabled=false;
    document.getElementById('btnRec').textContent='\u23FA 녹화';
  }
}

function play(){
  if(aid)cancelAnimationFrame(aid);
  st=null; playing=true; cntDone=false; boom=[];
  pts.forEach(p=>{p.y=Math.random()*H;});
  aid=requestAnimationFrame(render);
}

document.getElementById('btnPlay').addEventListener('click',()=>{
  if(playing){cancelAnimationFrame(aid);playing=false;document.getElementById('btnPlay').textContent='\u25B6 재생';}
  else{play();document.getElementById('btnPlay').textContent='\u23F9 정지';}
});

document.getElementById('btnRec').addEventListener('click',()=>{
  const stream=cv.captureStream(FPS);
  const mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm';
  const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:BITRATE});
  const chunks=[];
  rec.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data);};
  rec.onstop=()=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob(chunks,{type:mime}));
    a.download='reels_elevenlabs_videofx.webm'; a.click();
  };
  window._rc=()=>{rec.stop();};
  setTimeout(()=>{if(window._rc){window._rc();window._rc=null;}},TOTAL+1500);
  rec.start(); play();
  document.getElementById('btnPlay').textContent='\u23F9 정지';
  document.getElementById('btnRec').textContent='\u23FA 녹화 중...';
  document.getElementById('btnRec').disabled=true;
});

// 첫 프레임 렌더
requestAnimationFrame(n=>{st=n-80;tickPts();const sc=getScene(80);drawBg(80,sc.id);badge();drawHook(80);st=null;});
</script>
